<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>精彩活动等你来</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
      color: #333;
      line-height: 1.6;
      text-align: center;
      padding: 40px 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }
    h1 {
      color: #e63946;
      font-size: 2.5em;
      margin-bottom: 15px;
    }
    p {
      font-size: 1.2em;
      margin: 15px 0;
      color: #555;
    }
    .info {
      margin: 30px auto;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 10px;
      max-width: 600px;
      text-align: left;
      display: inline-block;
    }
    .info div {
      margin: 10px 0;
      font-weight: bold;
    }
    .btn {
      display: inline-block;
      margin-top: 30px;
      padding: 15px 40px;
      background: #007bff;
      color: white;
      font-size: 1.2em;
      border-radius: 50px;
      text-decoration: none;
      transition: 0.3s;
    }
    .btn:hover {
      background: #0056b3;
      transform: scale(1.05);
    }
    footer {
      margin-top: 50px;
      color: #aaa;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🔥 夏日音乐派对</h1>
    <p>一场属于年轻人的狂欢之夜，等你来加入！</p>

    <div class="info">
      <div>📅 时间：2025年6月28日 周六 19:00 - 23:00</div>
      <div>📍 地点：上海市黄浦区XX创意园 3F</div>
      <div>🎟 费用：免费入场（限量300人）</div>
      <div>👥 对象：所有热爱音乐的朋友</div>
    </div>

    <a href="https://docs.google.com/forms/d/e/..." target="_blank" class="btn">立即报名</a>

    <footer>
      主办方：星辰文化 | 联系我们：event@starx.com
    </footer>
  </div>

</body>
</html>
